name: DAST Security Scan

on:
  # Run on manual trigger
  workflow_dispatch:
    inputs:
      target_url:
        description: 'URL a escanear (vacío = usar variable del repo DAST_BACKEND_URL)'
        required: false
        type: string
      scan_type:
        description: 'Type of scan to perform'
        required: true
        default: 'baseline'
        type: choice
        options:
          - baseline  # Quick scan (2-3 minutes)
          - full      # Full scan (10+ minutes)
          - api       # API-specific scan

  # Optionally run on schedule (weekly on staging)
  schedule:
    - cron: '0 2 * * 0'  # Every Sunday at 2 AM

permissions:
  contents: read
  issues: write  # the ZAP actions open an issue with the findings (allow_issue_writing)

env:
  # URL por defecto: variable del repositorio DAST_BACKEND_URL (Settings → Secrets and variables → Actions → Variables).
  # Apunta al servicio Cloud Run del backend (NO al frontend mutuaasam.org).
  # También puedes pasar "target_url" al ejecutar el workflow a mano.
  DEFAULT_BACKEND_URL: ${{ vars.DAST_BACKEND_URL }}

jobs:
  dast-scan:
    name: OWASP ZAP Security Scan
    # Manual: siempre corre. Cron: solo si existe DAST_BACKEND_URL (si no, skipped, no failed).
    if: ${{ github.event_name == 'workflow_dispatch' || vars.DAST_BACKEND_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set target URL
        id: set-url
        env:
          # Inputs come in through the environment, not by interpolating the
          # expression into run:, so their values can't run as shell code.
          INPUT_TARGET_URL: ${{ inputs.target_url }}
          INPUT_SCAN_TYPE: ${{ inputs.scan_type }}
        run: |
          # Manual: inputs.target_url. Programado: vars.DAST_BACKEND_URL
          TARGET="$INPUT_TARGET_URL"
          if [ -z "$TARGET" ]; then
            TARGET="$DEFAULT_BACKEND_URL"
          fi
          if [ -z "$TARGET" ]; then
            echo "::error::Define la variable del repositorio DAST_BACKEND_URL (URL base del API en Cloud Run, p. ej. https://asam-backend-xxx.a.run.app) o ejecuta el workflow con target_url."
            exit 1
          fi
          # A single-line http(s) URL: anything else (e.g. a newline) could add
          # extra lines to GITHUB_OUTPUT.
          if [[ ! "$TARGET" =~ ^https?://[^[:space:]]+$ ]]; then
            echo "::error::target_url must be a single http(s) URL"
            exit 1
          fi

          {
            echo "target_url=$TARGET"
            # Use provided scan_type or default to baseline
            echo "scan_type=${INPUT_SCAN_TYPE:-baseline}"
          } >> "$GITHUB_OUTPUT"

      - name: Run OWASP ZAP Baseline Scan
        if: steps.set-url.outputs.scan_type == 'baseline'
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25  # v0.15.0
        with:
          target: ${{ steps.set-url.outputs.target_url }}
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a -j -l WARN'
          fail_action: false
          allow_issue_writing: true

      - name: Run OWASP ZAP Full Scan
        if: steps.set-url.outputs.scan_type == 'full'
        uses: zaproxy/action-full-scan@3c58388149901b9a03b7718852c5ba889646c27c  # v0.13.0
        with:
          target: ${{ steps.set-url.outputs.target_url }}
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a -j -l WARN'
          fail_action: false
          allow_issue_writing: true

      - name: Run OWASP ZAP API Scan
        if: steps.set-url.outputs.scan_type == 'api'
        uses: zaproxy/action-api-scan@5158fe4d9d8fcc75ea204db81317cce7f9e5453d  # v0.10.0
        with:
          target: ${{ steps.set-url.outputs.target_url }}/graphql
          format: graphql
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a -j -l WARN'
          fail_action: false
          allow_issue_writing: true

      - name: Upload ZAP Scan Results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: zap-scan-results
          if-no-files-found: ignore
          path: |
            report_html.html
            report_json.json
            report_md.md

      - name: Create Summary
        if: always()
        env:
          # The target URL comes from an input, so it goes through the environment too.
          TARGET_URL: ${{ steps.set-url.outputs.target_url }}
          SCAN_TYPE: ${{ steps.set-url.outputs.scan_type }}
        run: |
          {
            echo "## DAST Security Scan Results"
            echo ""
            echo "**Target URL:** $TARGET_URL"
            echo "**Scan Type:** $SCAN_TYPE"
            echo "**Scan Date:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            echo ""

            if [ -f "report_json.json" ]; then
              echo "✅ Scan completed successfully"
              echo ""
              echo "📊 Check the uploaded artifacts for detailed reports"
            else
              echo "⚠️ No scan results found"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
