name: Continuous Integration

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Permisos necesarios para GitHub Security
permissions:
  contents: read
  security-events: write
  actions: read

env:
  GO_VERSION: '1.26.9'
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_DB: asam_test
  POSTGRES_PORT: "5432"

jobs:
  # Job para configurar el entorno base, descargar dependencias y generar código.
  setup:
    name: Setup Environment & Generate Code
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify dependencies
        run: |
          go mod download
          go mod verify

      - name: Generate GraphQL code
        run: go run github.com/99designs/gqlgen@v0.17.95 generate

      - name: Upload workspace artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: workspace
          path: .

  lint:
    name: Lint Code
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download workspace artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: workspace
          path: .

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install and run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a  # v9
        with:
          version: v2.5.0
          install-mode: goinstall
          args: --timeout=5m ./cmd/... ./internal/... ./pkg/... ./test/...

  security:
    name: Security Scan (SAST)
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Download workspace artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: workspace
          path: .

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.28.0

      - name: Run gosec security scanner (full scan, non-blocking)
        run: |
          # Run gosec on the runner with the Go ${{ env.GO_VERSION }} toolchain from
          # setup-go — NOT the securego/gosec Docker action. That image ships an older
          # Go, and with GOTOOLCHAIN=local it cannot load a `go 1.26.7` module, so it
          # silently type-checks nothing and reports 0 issues. Running it here makes the
          # scan real. -no-fail keeps the SCAN non-blocking; the gate step below is what
          # fails the job, so the full report is always produced.
          # Excluded: test/seed (fake-data generators — math/rand there is not a
          # security concern, G404) and generated code (gqlgen output we don't edit).
          gosec -no-fail -exclude-dir=test/seed -exclude-generated -fmt json -out gosec-results.json ./...

      - name: Display full gosec report
        if: always()
        run: |
          if [ -f gosec-results.json ]; then
            echo "== Full gosec report (informational — the gate only fails on HIGH severity) =="
            jq -r '.Issues[] | "[\(.severity)/\(.confidence)] \(.rule_id) \(.file):\(.line) - \(.details)"' gosec-results.json || cat gosec-results.json
            echo "== Totals by severity =="
            jq -r '[.Issues[].severity] | group_by(.) | map("\(.[0])=\(length)") | join("  ")' gosec-results.json
          fi

      - name: Security gate — fail if gosec could not load the code
        run: |
          # A gosec whose golang.org/x/tools cannot read this Go version's export
          # data still exits cleanly with a partial scan: on go1.27, gosec v2.29.0
          # failed to load 68 files, saw 2 of 6 findings, and the HIGH gate stayed
          # green. Before #144 it scanned 0 files the same way. Fail on either.
          FILES=$(jq '.Stats.files' gosec-results.json)
          LOAD_ERRORS=$(jq '.["Golang errors"] | length' gosec-results.json)
          echo "gosec scanned $FILES file(s); files with load errors: $LOAD_ERRORS"
          if [ "$FILES" -eq 0 ] || [ "$LOAD_ERRORS" -gt 0 ]; then
            echo "::error::gosec scan is incomplete ($FILES files scanned, $LOAD_ERRORS with load errors). Usually a toolchain mismatch: the gosec build cannot read this Go version."
            jq -r '.["Golang errors"] | to_entries[:10][] | "\(.key): \(.value[0].error)"' gosec-results.json
            exit 1
          fi

      - name: Security gate — fail on HIGH severity findings
        run: |
          # Any confidence: the HIGH backlog was triaged to zero (#145), so a new
          # HIGH finding must be fixed or justified with an inline `#nosec <rule> -- why`.
          COUNT=$(jq '[.Issues[] | select(.severity=="HIGH")] | length' gosec-results.json)
          echo "gosec HIGH severity findings: $COUNT"
          if [ "$COUNT" -gt 0 ]; then
            echo "::error::gosec found $COUNT HIGH severity issue(s) — failing the build."
            jq -r '.Issues[] | select(.severity=="HIGH") | "[\(.severity)/\(.confidence)] \(.rule_id) \(.file):\(.line) - \(.details)"' gosec-results.json
            exit 1
          fi
          echo "No HIGH findings — gate passes."

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck (fails only on REACHABLE vulnerabilities)
        run: |
          # Default source mode: govulncheck exits non-zero (3) only when a vulnerable
          # symbol is actually reachable from our call graph, and exits 0 when the vuln
          # is merely present in the dependency tree but never called. No flags needed —
          # e.g. GO-2026-5932 (x/crypto/openpgp, unmaintained, not imported) stays green.
          govulncheck ./...

  test:
    name: Run Tests
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Download workspace artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: workspace
          path: .

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run unit tests with coverage
        run: make test-unit-coverage
        env:
          JWT_ACCESS_SECRET: "test-access-secret-for-unit-tests"
          JWT_REFRESH_SECRET: "test-refresh-secret-for-unit-tests"
          ENVIRONMENT: "test_unit"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          files: ./coverage-unit.out
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Wait for PostgreSQL to be ready
        run: |
          timeout 60 bash -c 'until pg_isready -h localhost -p ${{ env.POSTGRES_PORT }} -U ${{ env.POSTGRES_USER }}; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done'
        env:
          PGPASSWORD: ${{ env.POSTGRES_PASSWORD }}

      - name: Run database migrations
        run: go run cmd/migrate/main.go -cmd up
        env:
          DB_HOST: localhost
          DB_PORT: ${{ env.POSTGRES_PORT }}
          DB_USER: ${{ env.POSTGRES_USER }}
          DB_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          DB_NAME: ${{ env.POSTGRES_DB }}
          DB_SSL_MODE: "disable"

      - name: Run integration tests
        run: make test-integration
        env:
          DB_HOST: localhost
          DB_PORT: ${{ env.POSTGRES_PORT }}
          DB_USER: ${{ env.POSTGRES_USER }}
          DB_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          DB_NAME: ${{ env.POSTGRES_DB }}
          DB_SSL_MODE: "disable"
          JWT_ACCESS_SECRET: "test-access-secret-for-ci"
          JWT_REFRESH_SECRET: "test-refresh-secret-for-ci"
          ENVIRONMENT: "test"
          CI: "true"

  # Builds the production image on every PR so a broken Dockerfile (or a bad base
  # image swap) is caught before merge, not when a release tag is cut. Build only,
  # no push. Buildx + GitHub Actions cache keep repeat builds cheap.
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Build image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          push: false
          tags: asam-backend:ci-${{ github.sha }}
          # Read cache on every event; only WRITE it on push to main. Dependabot / fork
          # PRs run with a read-only GITHUB_TOKEN and cannot write the GHA cache — a
          # cache-to there 403s and can fail the build. Writing only on push keeps those
          # PRs (e.g. the pending base-image bump #137) green while still warming the
          # cache from main for every later PR to read.
          cache-from: type=gha
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max' || '' }}
