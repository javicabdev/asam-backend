name: Continuous Integration

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Permisos necesarios para GitHub Security
permissions:
  contents: read
  security-events: write
  actions: read

env:
  GO_VERSION: '1.26.7'
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_DB: asam_test
  POSTGRES_PORT: "5432"

jobs:
  # Job para configurar el entorno base, descargar dependencias y generar código.
  setup:
    name: Setup Environment & Generate Code
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify dependencies
        run: |
          go mod download
          go mod verify

      - name: Generate GraphQL code
        run: go run github.com/99designs/gqlgen@v0.17.73 generate

      - name: Upload workspace artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: workspace
          path: .

  lint:
    name: Lint Code
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download workspace artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: workspace
          path: .

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install and run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a  # v9
        with:
          version: v2.5.0
          install-mode: goinstall
          args: --timeout=5m ./cmd/api/... ./internal/... ./pkg/... ./test/...

  security:
    name: Security Scan (SAST)
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Download workspace artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: workspace
          path: .

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.28.0

      - name: Run gosec security scanner (full scan, non-blocking)
        run: |
          # Run gosec on the runner with the Go ${{ env.GO_VERSION }} toolchain from
          # setup-go — NOT the securego/gosec Docker action. That image ships an older
          # Go, and with GOTOOLCHAIN=local it cannot load a `go 1.26.7` module, so it
          # silently type-checks nothing and reports 0 issues. Running it here makes the
          # scan real. -no-fail keeps the SCAN non-blocking; the gate step below is what
          # fails the job, so the full report is always produced.
          gosec -no-fail -fmt json -out gosec-results.json ./...

      - name: Display full gosec report
        if: always()
        run: |
          if [ -f gosec-results.json ]; then
            echo "== Full gosec report (informational — the gate only fails on HIGH severity + HIGH confidence) =="
            jq -r '.Issues[] | "[\(.severity)/\(.confidence)] \(.rule_id) \(.file):\(.line) - \(.details)"' gosec-results.json || cat gosec-results.json
            echo "== Totals by severity =="
            jq -r '[.Issues[].severity] | group_by(.) | map("\(.[0])=\(length)") | join("  ")' gosec-results.json
          fi

      - name: Security gate — fail on HIGH severity + HIGH confidence findings
        run: |
          COUNT=$(jq '[.Issues[] | select(.severity=="HIGH" and .confidence=="HIGH")] | length' gosec-results.json)
          echo "gosec HIGH severity + HIGH confidence findings: $COUNT"
          if [ "$COUNT" -gt 0 ]; then
            echo "::error::gosec found $COUNT HIGH severity + HIGH confidence issue(s) — failing the build."
            jq -r '.Issues[] | select(.severity=="HIGH" and .confidence=="HIGH") | "[\(.severity)/\(.confidence)] \(.rule_id) \(.file):\(.line) - \(.details)"' gosec-results.json
            exit 1
          fi
          echo "No HIGH+HIGH findings — gate passes. The broader gosec backlog is tracked for triage."

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck (fails only on REACHABLE vulnerabilities)
        run: |
          # Default source mode: govulncheck exits non-zero (3) only when a vulnerable
          # symbol is actually reachable from our call graph, and exits 0 when the vuln
          # is merely present in the dependency tree but never called. No flags needed —
          # e.g. GO-2026-5932 (x/crypto/openpgp, unmaintained, not imported) stays green.
          govulncheck ./...

  test:
    name: Run Tests
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Download workspace artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: workspace
          path: .

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run unit tests with coverage
        run: make test-unit-coverage
        env:
          JWT_ACCESS_SECRET: "test-access-secret-for-unit-tests"
          JWT_REFRESH_SECRET: "test-refresh-secret-for-unit-tests"
          ENVIRONMENT: "test_unit"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        with:
          files: ./coverage-unit.out
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Wait for PostgreSQL to be ready
        run: |
          timeout 60 bash -c 'until pg_isready -h localhost -p ${{ env.POSTGRES_PORT }} -U ${{ env.POSTGRES_USER }}; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done'
        env:
          PGPASSWORD: ${{ env.POSTGRES_PASSWORD }}

      - name: Run database migrations
        run: go run cmd/migrate/main.go -cmd up
        env:
          DB_HOST: localhost
          DB_PORT: ${{ env.POSTGRES_PORT }}
          DB_USER: ${{ env.POSTGRES_USER }}
          DB_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          DB_NAME: ${{ env.POSTGRES_DB }}
          DB_SSL_MODE: "disable"

      - name: Run integration tests
        run: make test-integration
        env:
          DB_HOST: localhost
          DB_PORT: ${{ env.POSTGRES_PORT }}
          DB_USER: ${{ env.POSTGRES_USER }}
          DB_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          DB_NAME: ${{ env.POSTGRES_DB }}
          DB_SSL_MODE: "disable"
          JWT_ACCESS_SECRET: "test-access-secret-for-ci"
          JWT_REFRESH_SECRET: "test-refresh-secret-for-ci"
          ENVIRONMENT: "test"
          CI: "true"

  # Builds the production image on every PR so a broken Dockerfile (or a bad base
  # image swap) is caught before merge, not when a release tag is cut. Build only,
  # no push. Buildx + GitHub Actions cache keep repeat builds cheap.
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - name: Build image (no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          push: false
          tags: asam-backend:ci-${{ github.sha }}
          # Read cache on every event; only WRITE it on push to main. Dependabot / fork
          # PRs run with a read-only GITHUB_TOKEN and cannot write the GHA cache — a
          # cache-to there 403s and can fail the build. Writing only on push keeps those
          # PRs (e.g. the pending base-image bump #137) green while still warming the
          # cache from main for every later PR to read.
          cache-from: type=gha
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max' || '' }}
