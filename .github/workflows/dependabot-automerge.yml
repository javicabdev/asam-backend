name: Dependabot auto-merge

# Turns on auto-merge for Dependabot's Go and Docker minor/patch PRs. It does not
# merge anything itself: the "Protect main" ruleset only lets GitHub merge once
# the required CI checks pass on a branch that is up to date with main.
#
# Left manual on purpose:
# - semver-major updates: API breaks need a human;
# - gqlgen: its bump touches six places (CLAUDE.md);
# - github-actions updates: PR CI only exercises ci.yml, so an action used only
#   by release.yml or cloud-run-deploy.yml would break at the next deploy.

on: pull_request

permissions: {}

jobs:
  automerge:
    name: Enable auto-merge
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Also verifies that the PR and its commit really come from Dependabot.
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98  # v3.1.0

      # package-ecosystem comes from the branch name (dependabot/go_modules/...),
      # so Go is "go_modules", not the "gomod" used in dependabot.yml.
      - name: Enable auto-merge (squash)
        if: >-
          contains(fromJSON('["go_modules", "docker"]'), steps.meta.outputs.package-ecosystem) &&
          contains(fromJSON('["version-update:semver-minor", "version-update:semver-patch"]'), steps.meta.outputs.update-type) &&
          !contains(steps.meta.outputs.dependency-names, 'github.com/99designs/gqlgen')
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
