version: 2
updates:
  # Go modules
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
    open-pull-requests-limit: 5
    groups:
      go-indirect:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # gorm is pinned to 1.31.0: Preload broke in 1.31.1 (go-gorm/gorm#7686)
      # and no later version has been verified yet. Relax this only after
      # checking Preload on the candidate version.
      - dependency-name: "gorm.io/gorm"
        versions: [">1.31.0"]
      # gorm.io/driver/postgres >= 1.6.2 requires gorm >= 1.31.2, so it would
      # drag the pin forward. Drop together with the gorm ignore above.
      - dependency-name: "gorm.io/driver/postgres"
        versions: [">=1.6.2"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns: ["*"]

  # Docker
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
    open-pull-requests-limit: 2
    ignore:
      # The Go toolchain lives in 5 production locations that must move together
      # (CLAUDE.md > Dependency invariants). Dependabot can only bump the Dockerfiles,
      # which silently desyncs them. Go bumps are manual PRs touching all 5.
      - dependency-name: "golang"
