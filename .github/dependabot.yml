version: 2
updates:
  # Go modules
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
    open-pull-requests-limit: 5
    groups:
      # One weekly PR with every minor/patch Go update, auto-merged once the
      # required checks pass (.github/workflows/dependabot-automerge.yml).
      # Majors get their own PRs and stay manual. gqlgen is left out: its bump
      # touches six places (CLAUDE.md), so its PR is a signal, not a merge.
      go-minor-patch:
        patterns: ["*"]
        exclude-patterns: ["github.com/99designs/gqlgen"]
        update-types:
          - "minor"
          - "patch"
    ignore:
      # gorm 1.31.1 is known-bad upstream (Preload, go-gorm/gorm#7686). Newer
      # versions are allowed: test/integration/preload_relations_test.go
      # checks our Preload patterns, so a breaking bump turns CI red.
      - dependency-name: "gorm.io/gorm"
        versions: ["1.31.1"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns: ["*"]

  # Docker
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
    open-pull-requests-limit: 2
    ignore:
      # The Go toolchain lives in 5 production locations that must move together
      # (CLAUDE.md > Dependency invariants). Dependabot can only bump the Dockerfiles,
      # which silently desyncs them. Go bumps are manual PRs touching all 5.
      - dependency-name: "golang"
